[server]
headless = true
fileWatcherType = "none"

[client]
# Hide the Deploy/Stop developer toolbar during presentations.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# Pinned light theme: the dashboard is presented on projectors, and the chart
# colors are tuned for a light surface.
[theme]
base = "light"
primaryColor = "#1f5fae"
backgroundColor = "#fafbfc"
secondaryBackgroundColor = "#eef1f5"
textColor = "#1b2430"
